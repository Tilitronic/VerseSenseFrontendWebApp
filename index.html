<!doctype html>
<html>
  <head>
    <title><%= productName %></title>

    <meta charset="utf-8" />
    <meta name="description" content="<%= productDescription %>" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />
    <meta
      name="viewport"
      content="user-scalable=no, initial-scale=1, maximum-scale=1, minimum-scale=1, width=device-width<% if (ctx.mode.cordova || ctx.mode.capacitor) { %>, viewport-fit=cover<% } %>"
    />

    <!-- Preconnect to Google Fonts so the stylesheet and font files load
         without blocking the first paint. display=swap prevents FOIT. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,700;1,400&display=swap"
    />

    <link rel="icon" type="image/png" sizes="128x128" href="icons/favicon-128x128.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="icons/favicon-96x96.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16x16.png" />
    <link rel="icon" type="image/ico" href="favicon.ico" />

    <style>
      /* ── Splash: IPA phyllotaxis spiral ──────────────────────────────────────
         89 IPA symbols (Fibonacci) at  r=sqrt(n/N)·R, θ=n·goldenAngle
         Revealed via CSS transition + staggered setTimeout (avoids the known
         browser bug where animation-fill-mode:forwards drops var() opacity).
         The spiral div rotates continuously so the screen always looks alive.
      ── */
      #q-splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        background: #080c14;
        overflow: hidden;
        opacity: 1;
        transition: opacity 0.55s cubic-bezier(0.4, 0, 0.2, 1);
        pointer-events: none;
      }
      #q-splash.q-splash--out {
        opacity: 0;
      }

      /* Rotating container — full-screen so transform-origin stays at screen centre */
      #q-splash-spiral {
        position: absolute;
        inset: 0;
        animation: spiral-turn 30s linear infinite;
      }
      @keyframes spiral-turn {
        to {
          transform: rotate(360deg);
        }
      }

      /* Each symbol starts invisible/collapsed; JS transitions it to final state */
      .q-spl-s {
        position: absolute;
        opacity: 0;
        transform: translate(-50%, -50%) scale(0);
        font-family: 'Noto Serif', 'Linux Libertine', Georgia, serif;
        line-height: 1;
        user-select: none;
        transition:
          opacity 0.55s ease,
          transform 0.55s cubic-bezier(0.34, 1.2, 0.64, 1);
      }

      /* Centre label */
      #q-splash-lbl {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        font-family: 'Noto Serif', 'Linux Libertine', Georgia, serif;
        font-size: clamp(2.2rem, 7vw, 5.5rem);
        letter-spacing: 0.12em;
        color: rgba(144, 202, 249, 0.92);
        white-space: nowrap;
        opacity: 0;
        transition:
          opacity 0.6s ease,
          letter-spacing 0.6s ease;
        animation: lbl-pulse 2.5s ease-in-out 1.2s infinite alternate;
        text-shadow: 0 0 40px rgba(100, 180, 255, 0.4);
      }
      @keyframes lbl-pulse {
        from {
          opacity: 0.75;
        }
        to {
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <div id="q-splash" aria-hidden="true">
      <div id="q-splash-spiral"></div>
      <div id="q-splash-lbl">[ v&#x025C;&#x02D0;s &nbsp;s&#x025B;ns ]</div>
    </div>

    <script>
      (function () {
        var IPA = [
          /* Core vowels — UA ɨ, EN æ ɪ ʌ ɜ ʊ ə, PL common */
          'ɪ',
          'ɛ',
          'æ',
          'ɑ',
          'ɔ',
          'ʊ',
          'ə',
          'ʌ',
          'ɜ',
          'ɨ',
          /* Extended vowels — rounded, central, back */
          'ø',
          'œ',
          'ɯ',
          'ɒ',
          'ɐ',
          'ɵ',
          'ʉ',
          'ʏ',
          'ɤ',
          'ɞ',
          /* Fricatives & sonorants core — UA ʒ ʃ ɦ ʎ, PL ɕ ʑ, EN θ ð ŋ ɹ */
          'ʒ',
          'ʃ',
          'θ',
          'ð',
          'ŋ',
          'ɹ',
          'ɾ',
          'ɦ',
          'ʎ',
          'ɕ',
          /* Sibilants & velars — PL ʂ ʐ, UA/PL ɣ χ ʁ β ɸ ʑ */
          'ʑ',
          'ɲ',
          'ɫ',
          'ʂ',
          'ʐ',
          'ɣ',
          'χ',
          'ʁ',
          'β',
          'ɸ',
          /* Nasals, laterals, retroflex */
          'ʋ',
          'ɬ',
          'ɱ',
          'ɴ',
          'ɳ',
          'ʈ',
          'ɖ',
          'ɡ',
          'ʔ',
          'ɻ',
          /* Suprasegmentals + affricates — UA ʦ ʧ ʣ, PL ʥ, EN ʤ */
          'ˈ',
          'ˌ',
          'ː',
          'ˑ',
          'ʼ',
          'ʦ',
          'ʧ',
          'ʤ',
          'ʣ',
          'ʥ',
          /* Implosives, trills, rare but visually bold */
          'ɗ',
          'ɓ',
          'ʄ',
          'ɠ',
          'ʙ',
          'ʀ',
          'ɧ',
          'ʍ',
          'ɭ',
          'ɽ',
          /* Last 9 to reach Fibonacci 89 */
          'ɺ',
          'ɮ',
          'ħ',
          'ʜ',
          'ʛ',
          'ʝ',
          'ɰ',
          'ʡ',
          'ʢ',
        ];
        var N = 89;
        var GOLDEN = Math.PI * (3 - Math.sqrt(5));
        var spiral = document.getElementById('q-splash-spiral');
        var lbl = document.getElementById('q-splash-lbl');
        var vw = window.innerWidth,
          vh = window.innerHeight;
        var cx = vw / 2,
          cy = vh / 2;
        var R = Math.min(vw, vh) * 0.44;

        var spans = [];
        var finalOpacities = [];

        for (var i = 0; i < N; i++) {
          var t = i / (N - 1);
          var r = Math.sqrt(t) * R;
          var a = i * GOLDEN;
          var x = (cx + r * Math.cos(a)).toFixed(1);
          var y = (cy + r * Math.sin(a)).toFixed(1);
          var hue = Math.round(255 - t * 60);
          var sat = Math.round(70 + t * 25); /* was 55+35 — more saturated */
          var lig = Math.round(58 + t * 32); /* was 35+40 — much brighter */
          var opa = (0.45 + t * 0.5).toFixed(2); /* was 0.15+0.70 — no near-invisible symbols */
          var fs = (34 - t * 16).toFixed(1); /* was 22-13  — bigger across the board */

          var s = document.createElement('span');
          s.className = 'q-spl-s';
          s.textContent = IPA[i % IPA.length];
          s.style.left = x + 'px';
          s.style.top = y + 'px';
          s.style.fontSize = fs + 'px';
          s.style.color = 'hsl(' + hue + ',' + sat + '%,' + lig + '%)';
          spiral.appendChild(s);
          spans.push(s);
          finalOpacities.push(opa);
        }

        /* Reveal symbols centre → rim via staggered setTimeout.
           CSS transitions handle the actual scale/opacity animation,
           which correctly holds the final state (unlike animation-fill-mode:forwards
           with var() which has known browser inconsistencies). */
        for (var j = 0; j < N; j++) {
          (function (span, opa, delay) {
            setTimeout(function () {
              span.style.opacity = opa;
              span.style.transform = 'translate(-50%, -50%) scale(1)';
            }, delay);
          })(spans[j], finalOpacities[j], (j / (N - 1)) * 550);
        }

        /* Show label after the spiral is fully revealed */
        setTimeout(function () {
          lbl.style.opacity = '0.5';
          lbl.style.letterSpacing = '0.4em';
        }, 750);
      })();
    </script>

    <!-- quasar:entry-point -->
  </body>
</html>
